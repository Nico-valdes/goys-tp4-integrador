services:
  # ==============================================================
  # 1. SERVIDOR OBJETIVO (NGINX) - Producción
  # ==============================================================
  nginx-server:
    image: nginx:alpine
    container_name: goys-nginx
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    networks:
      goys-net:
        ipv4_address: 172.20.0.10
    ports:
      - "8080:80"
      - "5000:5000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./nginx/logs:/var/log/nginx
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ==============================================================
  # 2. CLIENTE / NODO ATACANTE (Simulador de tráfico y ataques)
  # ==============================================================
  attacker:
    build:
      context: ./attacker
    container_name: goys-attacker
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    networks:
      goys-net:
        ipv4_address: 172.20.0.99
    volumes:
      - ./scripts:/scripts:ro
    depends_on:
      - nginx-server

  # ==============================================================
  # 3. ASISTENTE CHATOPS & AIOps (Sidecar Agent con Stack de Red Compartido)
  # ==============================================================
  chatops-app:
    build:
      context: ./app
    container_name: goys-chatops
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    network_mode: "service:nginx-server"
    volumes:
      - ./nginx/logs:/var/log/nginx
      - ./app:/app
    depends_on:
      - nginx-server

# ================================================================
# DEFINICIÓN DE RED L2/L3 (DOCKER BRIDGE VIRTUAL)
# ================================================================
networks:
  goys-net:
    name: goys-net
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1

