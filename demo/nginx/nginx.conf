events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Formato de log claro y enriquecido para análisis forense / AIOps
    log_format aiops_format '$remote_addr - $remote_user [$time_local] '
                           '"$request" $status $body_bytes_sent '
                           '"$http_referer" "$http_user_agent" '
                           'rt=$request_time';

    access_log /var/log/nginx/access.log aiops_format;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost;

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
        }

        # Endpoint protegido para simular ataques de fuerza bruta / escaneo
        location /admin {
            return 401 "Acceso no autorizado: credenciales requeridas.\n";
        }

        location /api/secret {
            return 403 "Acceso prohibido.\n";
        }

        # Página de error
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}

